<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanLink Flow - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    
    <form id="formCadastro" action="#" method="POST" enctype="multipart/form-data">
      
      <!-- Radio Buttons para controle de estado via CSS -->
      <input type="radio" name="passo_perfil" id="radio-inicio" checked>
      <input type="radio" name="passo_perfil" id="radio-cliente" value="cliente">
      <input type="radio" name="passo_perfil" id="radio-motorista" value="motorista">
      <input type="radio" name="passo_perfil" id="radio-gestor" value="gestor">

      <!-- ETAPA 1: Seleção do Perfil (Cartões) -->
      <div class="etapa-1">
        <h2>Selecione o seu Perfil</h2>
        <p class="subtitulo">Como pretende utilizar o UrbanLink Flow?</p>
        
        <div class="card-grid">
          <label for="radio-cliente" class="card-btn">
            <span class="icon">📦</span>
            <div>
              <strong>Sou Cliente</strong>
              <small>Quero enviar ou acompanhar entregas</small>
            </div>
          </label>

          <label for="radio-motorista" class="card-btn">
            <span class="icon">🚚</span>
            <div>
              <strong>Sou Motorista / Condutor</strong>
              <small>Quero realizar entregas com meu veículo</small>
            </div>
          </label>

          <label for="radio-gestor" class="card-btn">
            <span class="icon">🏢</span>
            <div>
              <strong>Sou Gestor / Administrador</strong>
              <small>Quero gerenciar frotas e operações</small>
            </div>
          </label>
        </div>
      </div>

      <!-- ETAPA 2: Formulário Dinâmico -->
      <div class="etapa-2">
        <label for="radio-inicio" class="btn-voltar">← Voltar e alterar perfil</label>
        
        <h2 class="titulo-cliente">Cadastro de Cliente</h2>
        <h2 class="titulo-motorista">Cadastro de Motorista / Condutor</h2>
        <h2 class="titulo-gestor">Cadastro de Gestor / Administrador</h2>
        <p class="subtitulo">Preencha os campos abaixo para concluir</p>

        <!-- CAMPOS COMUNS -->
        <div class="form-group">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com">
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha de acesso">
        </div>

        <!-- ================= CAMPOS ESPECÍFICOS DE CLIENTE ================= -->
        <div class="campos-cliente">
          <hr>
          <p class="section-title">Dados do Cliente & Endereço</p>
          
          <div class="form-group">
            <label for="cpf_cnpj_cliente">CPF ou CNPJ:</label>
            <input type="text" id="cpf_cnpj_cliente" name="cpf_cnpj_cliente" placeholder="000.000.000-00 ou 00.000.000/0001-00">
          </div>

          <div class="form-group">
            <label for="endereco_rua">Endereço Padrão (Rua, Número, Bairro):</label>
            <input type="text" id="endereco_rua" name="endereco_rua" placeholder="Ex: Av. Paulista, 1000 - Apto 12">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cep">CEP:</label>
              <input type="text" id="cep" name="cep" placeholder="00000-000">
            </div>
            <div class="form-group">
              <label for="cidade">Cidade:</label>
              <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
            </div>
          </div>
        </div>

        <!-- ================= CAMPOS ESPECÍFICOS DE MOTORISTA ================= -->
        <div class="campos-motorista">
          <hr>
          <p class="section-title">Documentos do Condutor</p>

          <div class="form-row">
            <div class="form-group">
              <label for="cpf_motorista">CPF:</label>
              <input type="text" id="cpf_motorista" name="cpf_motorista" placeholder="000.000.000-00">
            </div>
            <div class="form-group">
              <label for="cnh_num">Número da CNH:</label>
              <input type="text" id="cnh_num" name="cnh_num" placeholder="00000000000">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cnh_cat">Categoria CNH:</label>
              <select id="cnh_cat" name="cnh_cat">
                <option value="A">A (Moto)</option>
                <option value="B">B (Carro)</option>
                <option value="C">C (Caminhão)</option>
                <option value="D">D (Van/Ônibus)</option>
                <option value="E">E (Articulado)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="cnh_validade">Validade CNH:</label>
              <input type="date" id="cnh_validade" name="cnh_validade">
            </div>
          </div>

          <div class="form-group">
            <label for="foto_cnh">Upload da Foto/Documento da CNH:</label>
            <input type="file" id="foto_cnh" name="foto_cnh" accept="image/*,.pdf">
          </div>

          <p class="section-title" style="margin-top: 15px;">Dados do Veículo</p>

          <div class="form-row">
            <div class="form-group">
              <label for="placa">Placa:</label>
              <input type="text" id="placa" name="placa" placeholder="ABC-1234">
            </div>
            <div class="form-group">
              <label for="modelo">Modelo:</label>
              <input type="text" id="modelo" name="modelo" placeholder="Ex: Fiorino / Cargo">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ano">Ano:</label>
              <input type="number" id="ano" name="ano" placeholder="2022">
            </div>
            <div class="form-group">
              <label for="cor">Cor:</label>
              <input type="text" id="cor" name="cor" placeholder="Ex: Branco">
            </div>
          </div>

          <div class="form-group">
            <label for="tipo_veiculo">Tipo de Veículo:</label>
            <select id="tipo_veiculo" name="tipo_veiculo">
              <option value="moto">Moto</option>
              <option value="carro">Carro</option>
              <option value="van">Van</option>
              <option value="caminhao">Caminhão</option>
              <option value="eletrico">Veículo Elétrico</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="combustivel">Combustível:</label>
              <select id="combustivel" name="combustivel">
                <option value="flex">Flex / Gasolina</option>
                <option value="diesel">Diesel</option>
                <option value="eletrico">Elétrico</option>
                <option value="gnv">GNV</option>
              </select>
            </div>
            <div class="form-group">
              <label for="capacidade_carga">Capacidade de Carga (kg/m³):</label>
              <input type="text" id="capacidade_carga" name="capacidade_carga" placeholder="Ex: 800 kg / 3m³">
            </div>
          </div>
        </div>

        <!-- ================= CAMPOS ESPECÍFICOS DE GESTOR ================= -->
        <div class="campos-gestor">
          <hr>
          <p class="section-title">Dados da Organização</p>

          <div class="form-group">
            <label for="cpf_gestor">CPF do Gestor:</label>
            <input type="text" id="cpf_gestor" name="cpf_gestor" placeholder="000.000.000-00">
          </div>

          <div class="form-group">
            <label for="cnpj_empresa">CNPJ da Empresa / Operadora:</label>
            <input type="text" id="cnpj_empresa" name="cnpj_empresa" placeholder="00.000.000/0001-00">
          </div>

          <div class="form-group">
            <label for="chave_convite">Chave de Acesso / Código de Convite:</label>
            <input type="text" id="chave_convite" name="chave_convite" placeholder="Ex: ORG-2026-X">
          </div>
        </div>

        <button type="submit" class="btn-submit">Finalizar Cadastro</button>
      </div>

    </form>
  </div>

</body>
</html>
