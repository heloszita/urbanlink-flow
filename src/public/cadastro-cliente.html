<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - UrbanLink</title>
    <!-- Aqui chamaria o seu global.css também -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/autenticacao.css">
</head>
<body>
    <!-- Área que centraliza o conteúdo no ecrã -->
    <main class="area-autenticacao">
        
        <!-- Cartão com borda azul de destaque -->
        <div class="cartao-autenticacao cartao-destaque-azul">
            <h1 class="titulo-autenticacao">Crie a sua conta para começar</h1>
            
            <div class="etiqueta-tipo-usuario">Cliente</div>
            
            <form class="formulario">
                <!-- Campo de linha inteira -->
                <div class="grupo-form">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Como devemos te chamar?">
                </div>
                
                <!-- Campos divididos na mesma linha -->
                <div class="linha-form">
                    <div class="grupo-form">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="grupo-form">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                </div>
                
                <div class="grupo-form">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com">
                </div>
                
                <div class="grupo-form">
                    <label for="celular">Número de celular</label>
                    <input type="tel" id="celular" placeholder="(21) 90000-0000">
                </div>
                
                <div class="linha-form">
                    <div class="grupo-form">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha" placeholder="Mínimo de 8 caracteres">
                    </div>
                    <div class="grupo-form">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Repita a senha">
                    </div>
                </div>
                
                <div class="grupo-checkbox">
                    <input type="checkbox" id="termos" checked>
                    <label for="termos" class="texto-checkbox">Li e aceito os termos de uso e a política de privacidade</label>
                </div>
                    
                <a href="inicial-cliente.html" class="botao botao-primario" style="display: block; text-decoration: none; box-sizing: border-box;">Criar minha conta</a>
        </div>

    </main>
</body>
</html
