<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Entregador - UrbanLink</title>
    <link rel="stylesheet" href="./css/autenticacao.css">
</head>
<body>
    <main class="area-autenticacao">
        
        <div class="cartao-autenticacao">
            <h1 class="titulo-autenticacao">Crie a sua conta para começar</h1>
            
            <div class="etiqueta-tipo-usuario">Entregador</div>
            
            <form class="formulario">
                <div class="grupo-form">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Como devemos te chamar?">
                </div>
                
                <div class="linha-form">
                    <div class="grupo-form">
                        <label for="cpf-cnpj">CPF ou CNPJ</label>
                        <input type="text" id="cpf-cnpj" placeholder="000.000.000-00">
                    </div>
                    <div class="grupo-form">
                        <label for="cnh">CNH</label>
                        <input type="text" id="cnh" placeholder="000000000">
                    </div>
                </div>
                
                <div class="grupo-form">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com">
                </div>
                
                <div class="grupo-form">
                    <label for="celular">Número de celular</label>
                    <input type="tel" id="celular" placeholder="(21) 90000-0000">
                </div>
                
                <div class="linha-form">
                    <div class="grupo-form">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha" placeholder="Mínimo de 8 caracteres">
                    </div>
                    <div class="grupo-form">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Repita a senha">
                    </div>
                </div>
                
                <div class="grupo-checkbox">
                    <input type="checkbox" id="termos" checked>
                    <label for="termos" class="texto-checkbox">Li e aceito os termos de uso e a política de privacidade</label>
                </div>
                
                <!-- Link estilizado como botão redirecionando para o Passo 2 -->
                <a href="informacoes-entregador.html" class="botao botao-primario" style="display: block; text-decoration: none; box-sizing: border-box; text-align: center; margin-top: 10px;">Adicionar informações do Veículo</a>
            </form>
        </div>

    </main>
</body>
</html>
